# Fast ByteTrack Configuration optimized for rapid track clearance on exit
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30  # Standard robust ByteTrack buffer: handles occlusion and prevents fragmented tracks
match_thresh: 0.8
fuse_score: True
